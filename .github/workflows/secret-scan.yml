name: Secret scan

# Deliberately has NO `paths:` filter. Two reasons:
#   1. A secret can be committed into any file, including the ones the other
#      pipelines ignore.
#   2. It guarantees every PR has at least one reported check, so a repo where
#      every other workflow was path-filtered out still reports something.
#
# Runs on the company's self-hosted runners — Windows first, macOS when no
# Windows box is online, GitHub-hosted as the last resort (company#127,
# CEO decision 2026-09-08). static `runs-on` capability labels choose the runner (#351); every `run:` is
# bash because the Windows default shell is PowerShell.

# Triggers (company#350 / #366): pull_request plus a weekly cron. There is no
# `push: master` trigger: every change reaches master through a PR the scan
# already covered, and the squash commit repeats the PR's tree. Consequence: a
# secret committed straight to master (no PR) is only caught by the Monday cron.
# Acceptable while every change goes through a PR; revisit if direct pushes return.

on:
  pull_request:
  schedule:
    # Mondays 04:17 UTC. An off-the-hour minute avoids the scheduling stampede
    # that delays every job defined at :00.
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: a secret that was committed and then "removed" in a later
      # commit is still in the history and still compromised. fetch-depth 0 is
      # what makes `gitleaks git` able to see it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # The official gitleaks-action requires a paid licence key for
      # organisation accounts, and Derinbay-Labs is an org — spending money is a
      # CEO decision (constitution §2). Until company#127 the scanner arrived
      # as the `docker://ghcr.io/gitleaks/gitleaks` container action; a
      # container action only runs on a Linux runner, and this job now runs
      # on the self-hosted Windows box (or a Mac). So the same pinned version
      # is built from its Go module instead — `go install` verifies it
      # against the Go checksum database, a stronger pin than an image tag.
      # The Go toolchain version comes from backend/go.mod, like every other
      # Go step in this repo.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false

      # All four kobe runners run as one user, so by default they share
      # one GOCACHE and one GOPATH/bin, and concurrent Go builds fail with
      # `could not import ... (open ...\go-build\...)` (company#199). Each
      # runner's tool cache is its own and persists, so the cache stays warm.
      - name: Per-runner Go cache
        run: |
          echo "GOCACHE=$RUNNER_TOOL_CACHE/go-build" >> "$GITHUB_ENV"
          echo "GOBIN=$RUNNER_TOOL_CACHE/go-bin" >> "$GITHUB_ENV"
          echo "$RUNNER_TOOL_CACHE/go-bin" >> "$GITHUB_PATH"

      - name: Install gitleaks
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1

      # `gitleaks git` and not `gitleaks detect`: `detect` has been deprecated
      # since v8.19.
      #
      # --redact so a finding never prints the secret into a public build log
      # (constitution §9: never print secrets to logs).
      - name: Scan the full git history
        run: gitleaks git . --redact --no-banner --verbose --exit-code 1

      # `git` scans commits; `dir` scans the working tree, which also covers
      # anything untracked or added by a build step.
      - name: Scan the working tree
        run: gitleaks dir . --redact --no-banner --exit-code 1

      - name: What to do if this failed
        if: failure()
        run: |
          cat <<'EOF'
          A potential secret was found. Do NOT just delete the line and push.

          1. Treat the credential as compromised and ROTATE it now.
          2. Remove it from the code; real secrets belong in .env (never
             committed) with a placeholder in example.env (constitution §9).
          3. If it is a false positive, add a narrowly scoped rule or an
             allowlist entry to .gitleaks.toml with a comment explaining why —
             never a blanket exclusion.
          4. Tell the CEO with a `ceo-action` issue: rotation is their action.

          The finding above is redacted on purpose. Reproduce locally with:
            go install github.com/zricethezav/gitleaks/v8@v8.30.1
            gitleaks git . --redact --verbose
          EOF
